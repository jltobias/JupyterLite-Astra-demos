name: Build and deploy JupyterBook + JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # GitHub project sites are served beneath /<repository-name>.
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Current Jupyter Book / MyST site tooling expects a modern Node runtime.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build JupyterBook
        run: jupyter book build --html

      - name: Build JupyterLite
        run: >-
          jupyter lite build
          --contents content/notebooks
          --output-dir _build/html/lite
          --base-url "${BASE_URL}/lite/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
