name: Build and deploy JupyterBook + JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build JupyterBook
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          jupyter book build --html > book-build.log 2>&1
          status=$?
          cat book-build.log
          if [ "$status" -ne 0 ]; then
            encoded=$(base64 -w 0 book-build.log)
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/diagnostics/book-build-${GITHUB_RUN_ID}.log" \
              -f message="Capture Jupyter Book build log for run ${GITHUB_RUN_ID}" \
              -f content="$encoded" \
              -f branch="astra-jupyterlite-book"
            exit "$status"
          fi

      - name: Build JupyterLite
        run: >-
          jupyter lite build
          --contents content/notebooks
          --output-dir _build/html/lite
          --base-url "${BASE_URL}/lite/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
