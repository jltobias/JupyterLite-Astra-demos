name: Build and deploy JupyterBook + JupyterLite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build and validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check source synchronization and mathematical edge cases
        run: python -m pytest -q

      - name: Execute every notebook and refresh previews
        run: python scripts/execute_notebooks.py

      - name: Build JupyterBook
        run: jupyter book build --html

      - name: Build JupyterLite
        run: >-
          jupyter lite build
          --contents content/notebooks
          --output-dir _build/html/lite
          --base-url "${BASE_URL}/lite/"

      - name: Copy World Lab and artwork
        run: python scripts/copy_site_assets.py

      - name: Install browser for scene checks
        run: python -m playwright install --with-deps chromium

      - name: Check all six interactive scenes
        run: python scripts/check_browser.py --root _build/html --base-url "${BASE_URL}"

      - name: Run representative notebooks in browser Python
        run: python scripts/check_jupyterlite.py --root _build/html --base-url "${BASE_URL}"

      - name: Save browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: test-results/

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
